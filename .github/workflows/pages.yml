name: Deploy GRE Context Lab to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "tools/validate_pack.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate vocabulary and question pack
        run: python tools/validate_pack.py
      - name: Check Python desktop helper syntax
        run: python -m py_compile tools/desktop_app.py tools/desktop_sync.py tools/validate_pack.py
      - name: Check browser JavaScript syntax
        run: node --check docs/app.js && node --check docs/local-example-provider.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "docs"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
